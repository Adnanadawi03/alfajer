<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Dashboard — Fajer Plastics Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --royal:#241C6E; --leaf:#1E9B57; --violet:#422766;
    --ink:#1E2130; --ink-soft:#666B7A; --line:#E6E4EF;
    --paper:#FFFFFF; --paper-2:#FAF9FC; --tint:#F4F3FA;
    --new:#0064B1; --confirmed:#C79A2E; --preparing:#7A57B8; --shipped:#1E9B57; --completed:#2E7D32; --cancelled:#C0392B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper-2);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Sora',sans-serif;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 480px at 85% -10%, #EDEBFB 0%, transparent 60%),
               radial-gradient(900px 420px at 5% 0%, #E7F5EC 0%, transparent 55%);
  }
  .login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;max-width:380px;width:100%;box-shadow:0 20px 50px -20px rgba(30,20,80,0.2);}
  .login-card h1{font-size:22px;font-weight:800;}
  .login-card p.sub{color:var(--ink-soft);font-size:13.5px;margin-top:6px;}
  label{display:block;font-size:12.5px;font-weight:700;margin:16px 0 5px;}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-family:'Inter';font-size:14px;}
  input:focus{outline:none;border-color:var(--royal);}
  .btn-solid{
    font-family:'Inter';font-weight:700;font-size:14.5px;color:#fff;background:var(--royal);
    border:none;border-radius:9px;padding:12px 20px;cursor:pointer;width:100%;margin-top:20px;
  }
  .btn-solid:hover{opacity:.9;}
  .btn-solid:disabled{opacity:.6;cursor:not-allowed;}
  .error-msg{color:var(--cancelled);font-size:13px;margin-top:12px;display:none;}
  .error-msg.show{display:block;}

  /* ---------- Dashboard shell ---------- */
  #dashboard{display:none;}
  header.top{
    background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .top-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;}
  .top-inner .brand{font-family:'Sora';font-weight:800;font-size:17px;}
  .top-actions{display:flex;align-items:center;gap:12px;}
  select{
    padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter';font-size:13.5px;
    background:#fff;color:var(--ink);cursor:pointer;
  }
  .btn-ghost{
    font-family:'Inter';font-weight:700;font-size:13.5px;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;
  }
  .btn-ghost:hover{border-color:var(--royal);}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  #empty-msg{color:var(--ink-soft);text-align:center;padding:60px 20px;font-size:14.5px;}

  /* ---------- Order rows ---------- */
  .order-card{
    background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;
  }
  .order-row{
    display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer;flex-wrap:wrap;
  }
  .order-row:hover{background:var(--tint);}
  .order-main{flex:1;min-width:200px;}
  .order-name{font-weight:700;font-size:14.5px;}
  .order-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .order-items-preview{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .status-badge{
    font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;color:#fff;white-space:nowrap;
  }
  .order-time{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .chevron{color:var(--ink-soft);font-size:13px;transition:transform .15s;}
  .order-card.open .chevron{transform:rotate(90deg);}

  .order-details{display:none;border-top:1px solid var(--line);padding:18px;background:var(--paper-2);}
  .order-card.open .order-details{display:block;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:640px){ .detail-grid{grid-template-columns:1fr;} }
  .detail-field .k{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;}
  .detail-field .v{font-size:14px;margin-top:3px;word-break:break-word;}
  .items-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  .items-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-soft);padding:6px 10px;border-bottom:1px solid var(--line);}
  .items-table td{padding:8px 10px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status-row label{margin:0;font-size:12.5px;}

  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Order Dashboard</h1>
    <p class="sub">Sign in to view and manage orders.</p>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit" class="btn-solid" id="login-btn">Sign In</button>
      <p class="error-msg" id="login-error"></p>
    </form>
  </div>
</div>

<div id="dashboard">
  <header class="top">
    <div class="top-inner">
      <div class="brand">Fajer Plastics — Orders</div>
      <div class="top-actions">
        <select id="status-filter">
          <option value="all">All statuses</option>
          <option value="New">New</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Preparing">Preparing</option>
          <option value="Shipped">Shipped</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        <button class="btn-ghost" id="logout-btn">Log out</button>
      </div>
    </div>
  </header>
  <main>
    <div id="orders-list"></div>
    <p id="empty-msg" style="display:none;">No orders yet — they'll show up here as soon as a customer checks out.</p>
  </main>
</div>

<script type="module">
  import { db } from './firebase-init.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    collection, query, orderBy, onSnapshot, doc, updateDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const auth = getAuth();

  const STATUS_COLORS = {
    New:'var(--new)', Confirmed:'var(--confirmed)', Preparing:'var(--preparing)',
    Shipped:'var(--shipped)', Completed:'var(--completed)', Cancelled:'var(--cancelled)'
  };

  let allOrders = [];
  let currentFilter = 'all';
  let unsubscribe = null;

  // ---------- Auth ----------
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errEl.textContent = 'Sign-in failed — check your email and password.';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      startOrdersListener();
    } else {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      if(unsubscribe) unsubscribe();
    }
  });

  // ---------- Orders ----------
  function startOrdersListener(){
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
    unsubscribe = onSnapshot(q, (snapshot) => {
      allOrders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderOrders();
    });
  }

  document.getElementById('status-filter').addEventListener('change', (e) => {
    currentFilter = e.target.value;
    renderOrders();
  });

  function formatTime(ts){
    if(!ts || !ts.toDate) return '';
    const d = ts.toDate();
    return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function renderOrders(){
    const list = document.getElementById('orders-list');
    const emptyMsg = document.getElementById('empty-msg');
    const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

    if(filtered.length === 0){
      list.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    list.innerHTML = filtered.map(o => orderCardHTML(o)).join('');

    // Wire up row-click (expand) and status dropdown change handlers
    filtered.forEach(o => {
      const card = document.getElementById('card-' + o.id);
      const row = card.querySelector('.order-row');
      row.addEventListener('click', () => card.classList.toggle('open'));

      const statusSelect = card.querySelector('.status-select');
      statusSelect.addEventListener('click', e => e.stopPropagation());
      statusSelect.addEventListener('change', async (e) => {
        await updateDoc(doc(db, 'orders', o.id), { status: e.target.value });
      });
    });
  }

  function orderCardHTML(o){
    const itemsPreview = (o.items || []).map(i => `${i.name} x${i.qty}`).join(', ');
    const color = STATUS_COLORS[o.status] || 'var(--ink-soft)';
    const itemsRows = (o.items || []).map(i => `
      <tr><td>${i.code}</td><td>${i.name}</td><td>${i.qty}</td></tr>
    `).join('');

    return `
      <div class="order-card" id="card-${o.id}">
        <div class="order-row">
          <div class="order-main">
            <div class="order-name">${o.name || 'Unnamed'}${o.company ? ' · ' + o.company : ''}</div>
            <div class="order-items-preview">${itemsPreview}</div>
          </div>
          <span class="status-badge" style="background:${color};">${o.status || 'New'}</span>
          <span class="order-time">${formatTime(o.createdAt)}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="order-details">
          <div class="detail-grid">
            <div class="detail-field"><div class="k">Phone</div><div class="v">${o.phone || '—'}</div></div>
            <div class="detail-field"><div class="k">Email</div><div class="v">${o.email || '—'}</div></div>
            <div class="detail-field"><div class="k">Company</div><div class="v">${o.company || '—'}</div></div>
            <div class="detail-field"><div class="k">Notes</div><div class="v">${o.notes || '—'}</div></div>
          </div>
          <table class="items-table">
            <thead><tr><th>Code</th><th>Product</th><th>Qty</th></tr></thead>
            <tbody>${itemsRows}</tbody>
          </table>
          <div class="status-row">
            <label>Status:</label>
            <select class="status-select">
              ${['New','Confirmed','Preparing','Shipped','Completed','Cancelled'].map(s =>
                `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
